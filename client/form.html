<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill Out Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 600px; margin-top: 3rem;">
    <div class="card" style="border-top: 8px solid var(--primary-color);">
      <h1 id="public-title">Loading...</h1>
      <p id="public-description"></p>
    </div>

    <form id="public-form">
      <div id="public-questions-container">
        </div>
      
      <button type="submit" class="btn" id="submit-btn" style="width: 100%; margin-top: 1rem; font-size: 1.1rem;">Submit Response</button>
      <button type="button" id="clear-form-btn" class="btn" style="background: #9ca3af; margin-left: 10px;">
        Clear Answers
    </button>
    </form>

    <div id="success-message" class="card" style="display: none; text-align: center; margin-top: 2rem;">
      <h2>Thank you!</h2>
      <p>Your response has been recorded.</p>
    </div>
  </div>

  <script src="form.js"></script>
</body>
</html>
